<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FormaCAD Studio — Local</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#11141a;color:#f4f6fb;font:14px system-ui,sans-serif}header,nav{padding:12px;background:#1a1e26;display:flex;align-items:center;gap:8px;flex-wrap:wrap}header b{font-size:16px}input,button{font:inherit}input{background:#111720;color:#f4f6fb;border:1px solid #424c5c;border-radius:6px;padding:8px;max-width:100%}button{padding:9px 12px;border-radius:7px;background:#29313e;color:white;border:1px solid #424c5c;cursor:pointer}button:hover{background:#3b4a60}button.active{background:#41669c}#name{min-width:180px;flex:1}main{height:calc(100vh - 112px);min-height:420px;display:grid;grid-template-columns:190px minmax(0,1fr) 230px}aside{padding:12px;background:#1a1e26;overflow:auto}canvas{display:block;width:100%;height:100%;min-width:0}#tree div{overflow-wrap:anywhere}#props p{margin:12px 0 5px;color:#bdc8d9}.triple{display:flex;gap:4px}.triple input{width:33%;min-width:0}small{color:#aeb9ca}@media(max-width:700px){main{grid-template-columns:120px minmax(0,1fr);height:calc(100vh - 155px)}main aside:last-child{grid-column:1/-1;max-height:180px}header,nav{gap:5px;padding:8px}button{padding:7px}}
</style>
</head>
<body>
<header><b>FormaCAD Studio</b><input id="name" value="Projet sans titre" aria-label="Nom du projet"><button id="save">Enregistrer</button><button id="settings">Connexion Supabase</button></header>
<nav><button id="new-project">Nouveau</button><button id="open">Ouvrir JSON</button><button id="box">+ Bloc</button><button id="sphere">+ Sphère</button><button id="cylinder">+ Cylindre</button><button id="sketch-rect">Esquisse rectangle</button><button id="sketch-circle">Esquisse cercle</button><button id="extrude">Extrusion</button><button data-mode="translate">Déplacer</button><button data-mode="rotate">Tourner</button><button data-mode="scale">Échelle</button><button data-mode="select" class="active">Sélection</button><button id="delete">Supprimer</button><button id="json">Exporter JSON</button><button id="stl">Exporter STL</button><input id="file-input" type="file" accept=".json,application/json" hidden></nav>
<main><aside><b>Arbre du projet</b><div id="tree"></div><p><small>Astuce : clique sur un objet pour le sélectionner.</small></p></aside><canvas id="view" aria-label="Vue 3D"></canvas><aside><b>Inspecteur</b><div id="props">Sélectionne un objet.</div></aside></main>
<script type="module" src="./formacad.js"></script>
</body></html>
